spring:
  application:
    name: opsflow
  web:
    resources:
      static-locations: classpath:/static/
      add-mappings: true
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/opsflow?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:YOUR_PASSWORD_HERE}  # 使用环境变量，默认值为占位符
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.opsflow.dao.model
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080

logging:
  level:
    com.opsflow: DEBUG
    root: INFO

