<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPSFLOW</title>
    <link rel="stylesheet" href="/css/style.css?v=20">
    <script src="/js/i18n/i18n.js?v=2"></script>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-lang">
                <label for="localeSwitcher" data-i18n="header.language">语言</label>
                <select id="localeSwitcher" onchange="onLocaleSwitcherChange(this)">
                    <option value="zh">中文</option>
                    <option value="en">English</option>
                </select>
            </div>
            <div class="login-header brand-header">
                <img data-brand-logo class="brand-logo brand-logo-login" alt="" hidden>
                <h1 data-brand-text data-i18n="login.title">OPSFLOW</h1>
            </div>
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username" data-i18n="login.username">用户名</label>
                    <input type="text" id="username" name="username" required
                           data-i18n-placeholder="login.usernamePlaceholder" placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label for="password" data-i18n="login.password">密码</label>
                    <input type="password" id="password" name="password" required
                           data-i18n-placeholder="login.passwordPlaceholder" placeholder="请输入密码">
                </div>
                <div class="form-group">
                    <button type="submit" class="btn-login" data-i18n="login.submit">登录</button>
                </div>
                <div id="feishuLoginBox" class="sso-login-box" style="display:none;">
                    <div class="sso-divider"><span data-i18n="login.or">或</span></div>
                    <a id="feishuLoginBtn" class="btn-feishu-login" href="/api/auth/feishu/login" data-i18n="login.feishu">使用飞书登录</a>
                </div>
                <div id="errorMsg" class="error-msg"></div>
            </form>
        </div>
    </div>
    <script src="/js/login.js?v=3"></script>
</body>
</html>
