# 公共配置（所有环境共用）。应用配置文件只放在 config/ 目录，需在项目根目录（或容器 /app）下启动。
# 环境由 SPRING_PROFILES_ACTIVE=dev|test|prod 选择，application-<env>.yml 只写与本文件不同的项。
# 数据库连接统一用 DB_URL / DB_USERNAME / DB_PASSWORD 注入：环境变量，或不入库的 config/application-local.yml。
spring:
  application:
    name: opsflow
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/opsflow?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  web:
    resources:
      static-locations: classpath:/static/
      add-mappings: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.opsflow.dao.model
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080
  servlet:
    session:
      cookie:
        # 跨站请求不带登录 Cookie（顶层导航的 GET 除外），配合写接口的来源校验防 CSRF
        same-site: lax
        http-only: true

# 飞书 / LDAP 等集成配置在「系统设置」页面维护（system_config 表），不在配置文件中。
opsflow:
  # License 强校验：false=关闭（功能全开）；后期改为 true 重新启用
  license:
    enforcement-enabled: false
  branding:
    dir: ./data/branding
  pipeline:
    log-dir: ./data/pipeline-logs
    # 同时执行的流水线任务上限，超出的任务排队（界面显示「排队中」）
    max-concurrent-jobs: 10
  deploy:
    # 上线任务模块因同一服务正在部署而排队时，除任务结束时自动唤醒外，按此间隔兜底巡检（毫秒）
    cd-resume-interval-ms: 60000
  # Git 推送 Webhook（/api/webhook/git）校验密钥；为空则关闭 Webhook。
  # 请通过环境变量 OPSFLOW_WEBHOOK_SECRET 或 config/application-local.yml 设置，不要提交到仓库。
  db:
    # 启动时自动执行未执行的数据库迁移（Flyway，版本文件在 jar 内的 db/migration）。
    # 设为 false 时启动不改库，有未执行的迁移就拒绝启动，需先手动执行 scripts/database/migrate.sh
    migrate-on-startup: ${OPSFLOW_DB_MIGRATE:true}
  security:
    # 写接口校验 Origin/Referer 与当前站点一致；反向代理改写了 Host 且未传 X-Forwarded-Host 时，
    # 在 allowed-origins 里填对外访问地址（逗号分隔，如 https://ops.example.com）
    csrf-origin-check: ${OPSFLOW_CSRF_ORIGIN_CHECK:true}
    allowed-origins: ${OPSFLOW_ALLOWED_ORIGINS:}
  webhook:
    secret: ${OPSFLOW_WEBHOOK_SECRET:}
  # 保留策略：每天定时清理；天数 ≤ 0 表示不清理该项。有 system:config 权限的用户可调用 POST /api/system/retention?dryRun=true 预览
  retention:
    enabled: true
    cron: "0 30 3 * * ?"
    # 完整阶段日志文件保留天数，超期只保留末尾摘要
    log-days: 30
    # 构建记录保留天数；超期且不在任务最近 keep-latest-per-task 次内的记录删除（任务本身与上线任务记录始终保留）
    record-days: 180
    keep-latest-per-task: 50
    # 操作审计保留天数
    audit-days: 180

logging:
  level:
    com.opsflow: INFO
    root: INFO

# 本机覆盖配置：未激活 profile 时在这里引入；激活了 profile 时由 application-<env>.yml 引入，
# 这样 application-local.yml 总是优先于当前环境文件（同一文件只会被导入一次）。
---
spring:
  config:
    activate:
      on-profile: default
    import: "optional:file:./config/application-local.yml"
