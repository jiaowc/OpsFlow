# 公共配置（所有环境共用）。应用配置文件只放在 config/ 目录，需在项目根目录（或容器 /app）下启动。
# 环境由 SPRING_PROFILES_ACTIVE=dev|test|prod 选择，application-<env>.yml 只写与本文件不同的项。
# 数据库连接统一用 DB_URL / DB_USERNAME / DB_PASSWORD 注入：环境变量，或不入库的 config/application-local.yml。
spring:
  application:
    name: opsflow
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/opsflow?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  web:
    resources:
      static-locations: classpath:/static/
      add-mappings: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.opsflow.dao.model
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080

# 飞书 / LDAP 等集成配置在「系统设置」页面维护（system_config 表），不在配置文件中。
opsflow:
  # License 强校验：false=关闭（功能全开）；后期改为 true 重新启用
  license:
    enforcement-enabled: false
  pipeline:
    log-dir: ./data/pipeline-logs

logging:
  level:
    com.opsflow: INFO
    root: INFO

# 本机覆盖配置：未激活 profile 时在这里引入；激活了 profile 时由 application-<env>.yml 引入，
# 这样 application-local.yml 总是优先于当前环境文件（同一文件只会被导入一次）。
---
spring:
  config:
    activate:
      on-profile: default
    import: "optional:file:./config/application-local.yml"
